plugins { id 'com.android.application' }
android {
    namespace 'ru.holorigg.musicsync'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'ru.holorigg.musicsync'
        minSdk 26
        targetSdk 35
        versionCode 20002
        versionName '2.0.2'
        resValue 'string', 'app_name', 'Моя музыка'
    }
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
        test.java.srcDirs = ['../tests/jvm']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'Моя музыка · Dev'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2048m'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'music.project.root', rootProject.projectDir.absolutePath
        }
    }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}
