name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check public source tree
        run: python tools/check_public_tree.py
      - name: Install Python dependencies
        run: python -m pip install -r desktop/requirements.lock.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Run offline desktop checks
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 run_checks.py

  android:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test, build and lint Android
        working-directory: android
        run: .\gradlew.bat --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintRelease
